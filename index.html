<!doctype html>
<html>

<title>PS5</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{
    user-select:none; -webkit-user-select:none;
    background-color:#0c0c0f; color:#fff; font-family:Arial;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    height:100vh; margin:0; padding:0; overflow:hidden; box-sizing:border-box;
}
#cat{ width:240px; max-width:66vw; border-radius:10px; margin-bottom:26px;
      box-shadow:0 0 0 2px #2a2a2e, 0 0 20px 4px #2a2a2e; }
.btn{
    padding:1rem 2rem; text-align:center; cursor:pointer;
    min-width:12rem; border-radius:1.25rem; background-color:#202125;
    border:none; color:#fff; font-size:1.5rem; font-weight:800;
    transition:background-color 0.25s ease;
}
.btn:hover{ background-color:#a2a2a6; color:#202020; }
</style>
</head>
<body>
<img id="cat" src="cat.jpg" alt="">
<a tabindex="0" class="btn" id="run">RUN</a>

};

function hex(v) { return "0x" + v.toString(16); }

const m = /PlayStation 5\/(\d+)\.(\d+)/.exec(navigator.userAgent);
const fw = m ? `${m[1].padStart(2, "0")}.${m[2].padStart(2, "0")}` : null;
const e = fw ? OFFSETS[fw] : null;

document.getElementById("run").addEventListener("click", function () {
    const q = new URLSearchParams();
    q.set("go", "1");
    if (fw) q.set("fw", fw);
    if (e) {
        q.set("hc", e.hc.map(hex).join(",")); q.set("gd", hex(e.gd)); q.set("notify", hex(e.nt));
        q.set("gps", hex(e.gps)); q.set("gpe", hex(e.gpe));
        q.set("cls", hex(e.cls)); q.set("cle", hex(e.cle));
        q.set("ers", hex(e.ers)); q.set("ere", hex(e.ere));
    }
    location.href = `${EXPLOIT_URL}?${q.toString()}`;
});
